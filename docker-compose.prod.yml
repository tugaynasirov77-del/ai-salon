# Production docker-compose: Postgres + Redis + Backend
# Запускается на сервере: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-salon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_salon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d ai_salon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-salon-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-salon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://salon:${POSTGRES_PASSWORD}@postgres:5432/ai_salon
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      BASE_URL: ${BASE_URL}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"  # доступно только локально, nginx будет проксировать

volumes:
  pgdata:
  redisdata:

# Включаем IPv6 — российские провайдеры блокируют IPv4 к Cloudflare/Anthropic,
# хост работает через IPv6, контейнеры должны тоже.
networks:
  default:
    enable_ipv6: true
    driver: bridge
    ipam:
      config:
        - subnet: "172.30.0.0/16"
        - subnet: "fd00:beef::/64"
